# ローカル確認専用。ConoHa には送らない・同期しない。
#
# 起動するのは Web UI（app.js / :3052）のみ。
# gsaxo（Saxo 本番Bot）はここに含めない。
# ConoHa の pm2 gsaxo がポジションを持っている間は、
# ローカルでも gsaxo:daemon を起動しないこと。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3052:3052"
    env_file:
      - .env
    environment:
      PORT: "3052"
      # ローカル二重発注防止の保険（Saxo Bot はこの compose では起動しない）
      GSAXO_DRY_RUN: "true"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    command: ["npx", "nodemon", "--watch", ".", "--ext", "js,ejs,json", "app.js"]
    restart: unless-stopped

volumes:
  app_node_modules:
